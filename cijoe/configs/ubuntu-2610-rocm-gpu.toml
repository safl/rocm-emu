# A guest with an emulated RDMA NIC and an emulated AMD GPU, the NIC able to
# DMA into the GPU's VRAM. The NIC is rocm-ernic, as in xNVMe's
# configs/ubuntu-2610-rocm.toml, here on its loopback backend; the GPU is
# rocjitsu from the rocjitsu-host package. The image is nosi's
# ubuntu-2610-rocm, and the guest side of the GPU comes from the
# rocjitsu-guest-* packages, installed by the workflow.

# The SSH options are passed verbatim to paramiko; see https://www.paramiko.org/
[cijoe.transport.root]
username = "root"
password = "root"
hostname = "localhost"
port = 4200

# Operator account on nosi images; used by root_unlock.
[cijoe.transport.odus]
username = "odus"
password = "odus.321"
hostname = "localhost"
port = 4200

[qemu]
img_bin = "qemu-img"
default_guest = "ubuntu_2610_rocm_amd64"
default_systemimage = "ubuntu-2610-rocm-x86_64"

[qemu.systems.x86_64]
bin = "qemu-system-x86_64"

# Sized as xNVMe's guest, for a GitHub-hosted runner
[qemu.guests.ubuntu_2610_rocm_amd64]
path = "{{ local.env.HOME }}/guests/ubuntu-2610-rocm-amd64"
system_label = "x86_64"
system_args.kwa = {cpu = "host", smp = 4, m = "6G", accel = "kvm"}
system_args.raw = """\
-M q35 \
"""
system_args.tcp_forward = {host = 4200, guest = 22}

# The server's revision matches the image's ionic driver, as in xNVMe; the
# patches add what the NIC needs to reach the GPU, and change nothing the
# guest's driver sees.
[rocm_ernic]
repository = "https://github.com/ROCm/rocm-ernic"
sha = "cddb171f54feab119f7b6deca5c33148bb7c020d"
prefix = "{{ local.env.HOME }}/opt/rocm-ernic"
socket = "/tmp/vfio-user-rocm-ernic.sock"
backend = "loopback"
log_level = "info"
patches = ["../patches/rocm-ernic/0001-server-serve-DMA-into-another-vfio-user-device-s-BAR.patch"]

[rocm_ernic.libvfio_user]
repository = "https://github.com/nutanix/libvfio-user"
sha = "8039244"

# The guest's name for the NIC's RDMA device
[rocm_ernic.transport]
ibdev = "rocm-rdma-ernic0"

# 'vram_aperture' is the size of the GPU's BAR0, which rocjitsu backs with its
# VRAM memfd from offset 0; the NIC server binds the DMA region of that size.
[rocjitsu]
bin = "/opt/rocjitsu/bin/rocjitsu"
vram_bin = "/opt/rocjitsu/bin/rocjitsu-vram"
config = "/opt/rocjitsu/share/configs/gfx1250_mi455x.json"
socket = "/tmp/vfio-user-rocjitsu.sock"
vram_aperture = "256M"
guest_debs = "/tmp/artifacts"
