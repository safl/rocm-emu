oras.url = "oras://ghcr.io/safl/nosi/ubuntu-2610-rocm@sha256:a778f9a6ce500ca4165638b0cad7db5d3b5f34cec369df9d5d0c1c0f55213106"
disk.path = "{{ local.env.HOME }}/system_imaging/disk/ubuntu-2610-rocm-x86_64.qcow2"
