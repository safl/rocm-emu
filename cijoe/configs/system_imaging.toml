# ubuntu-2610-rocm:2026.W43, as xNVMe pins it. Its kernel is the one the
# rocjitsu-guest-amdgpu package is built for (versions.env, GUEST_KVER), and
# its ionic driver is from the rocm-ernic revision in ubuntu-2610-rocm-gpu.toml.
