# The oras digest is the .img.gz layer's, not the manifest's; this is
# ubuntu-2610-rocm:2026.W48, from the nosi images under refenv. Its kernel is the one the
# rocjitsu-guest-amdgpu package is built for (versions.env, GUEST_KVER), and
# its ionic driver is from the rocm-ernic revision in ubuntu-2610-rocm-gpu.toml.
[system-imaging.images.ubuntu-2610-rocm-x86_64]
system_label = "x86_64"

oras.url = "oras://ghcr.io/refenv/nosi/ubuntu-2610-rocm@sha256:cf4cbce553fd1fa39d69617a7bab58bf0e2564c2ef54e6e084adb402d6c2f4cc"
disk.path = "{{ local.env.HOME }}/system_imaging/disk/ubuntu-2610-rocm-x86_64.qcow2"
